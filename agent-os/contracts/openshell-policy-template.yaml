# card.compile_openshell_policy — source template
# Schema: https://docs.nvidia.com/openshell/latest/how-it-works/policies/schema
# (OpenShell v0.1.x; rejects unknown fields — do not add fields outside this schema)
#
# Placeholders: {{card_id}}, {{card_version}}, {{acting_hash}},
#   {{inference_host}}, {{inference_port}},
#   {{hold_queue_port}}, {{pocketbase_port}}
# Compiler fills all {{…}} from card Operations section + runtime config.
# Output path: compiled/{{card_id}}_v{{card_version}}/openshell-policy.yaml
#
# NOTE on credentials: inference API key is a Provider, not declared here.
#   Register it at gateway startup: `openshell provider add --name inference ...`
#   OpenShell injects it only to endpoints that declare the provider by name.
#
# NOTE on loopback (hold_queue, pocketbase): OpenShell's proxy intercepts
#   outbound connections; loopback reachability depends on gateway network mode.
#   Validate this during the spike — may require host networking or a sidecar
#   accessible by container hostname instead of 127.0.0.1.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app/zeroclaw
    - /etc
    - /var/log
    - /card/{{card_id}} # card mount: CARD.md + compiled soul.md/memory.md (matches compiler)
  read_write:
    - /data/{{card_id}} # per-card data dir (matches compiler)
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: agent
  run_as_group: agent

network_policies:
  hold_queue:
    name: hold-queue-sidecar
    endpoints:
      - host: 127.0.0.1
        port: {{hold_queue_port}}
    binaries:
      - path: /app/zeroclaw/zeroclaw

  inference:
    name: inference-endpoint
    endpoints:
      - host: "{{inference_host}}"
        port: {{inference_port}}
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /app/zeroclaw/zeroclaw

  pocketbase:
    name: pocketbase-ops-store
    endpoints:
      - host: 127.0.0.1
        port: {{pocketbase_port}}
    binaries:
      - path: /app/zeroclaw/zeroclaw

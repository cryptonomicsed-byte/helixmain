# helixmain.duckdns.org nginx server block
# IMPORTANT: The nginx stream module owns public port 443 (see stream-sni.conf).
# All sites on this server MUST listen on 127.0.0.1:8443, NOT on public 443.
# stream-sni.conf routes by SNI → nginx_http (127.0.0.1:8443).
# Certbot manages ssl_certificate lines — do not edit those manually.

server {
    server_name helixmain.duckdns.org www.helixmain.duckdns.org;

    root /var/www/helixmain-site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Owner dashboard (Vite SPA)
    location /dashboard {
        alias /var/www/helix-dashboard;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # API proxy → Fastify at 127.0.0.1:3101
    location /api/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    listen 127.0.0.1:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/helixmain.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helixmain.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = helixmain.duckdns.org) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name helixmain.duckdns.org www.helixmain.duckdns.org;
    return 404;
}

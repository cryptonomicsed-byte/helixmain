# ---------------------------------------------------------------------------
# SYNCED FROM LIVE — read before deploying.
# Source of truth is the RUNNING config on the host
# (/etc/nginx/sites-enabled/helixmain). This repo copy was stale: it carried a
# bare `location /gk/` and was MISSING the two deliberate 404 guards below, so
# the audit's "deploy the repo config" step would have DELETED security and
# exposed unauthenticated passkey enrollment.
# Direction of truth is live -> repo, never repo -> live.
# The two `return 404` lines are intentional; do not remove them.
# Verified in sync by: infra/verify-nginx-sync.sh
# == BEGIN CONFIG (everything below is byte-identical to the live file) ==
# helixmain.duckdns.org nginx server block
# IMPORTANT: The nginx stream module owns public port 443 (see stream-sni.conf).
# All sites on this server MUST listen on 127.0.0.1:8443, NOT on public 443.
# stream-sni.conf routes by SNI → nginx_http (127.0.0.1:8443).
# Certbot manages ssl_certificate lines — do not edit those manually.

server {
    server_name helixmain.duckdns.org www.helixmain.duckdns.org;

    root /var/www/helixmain-site;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Compression is scoped to THIS vhost on purpose. nginx.conf has `gzip on;`
    # but its gzip_types line is commented out, so today only text/html is
    # compressed and the landing's css/js ship raw (~150 KiB -> ~55 KiB gzipped).
    # Setting gzip_types here fixes this vhost without touching every other site
    # on the box.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;

    # Landing assets. They are NOT content-addressed, so the TTL stays modest:
    # a redeploy has to become visible without anyone purging a cache. (The
    # dashboard's assets ARE content-addressed and keep their immutable policy.)
    # add_header does not inherit across levels, so the security headers that sit
    # at server level are repeated deliberately here.
    location ~* ^/(landing\.(css|js)|vendor/.+\.js)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # Owner dashboard (Vite SPA)
    # Content-addressed assets: safe to cache forever.
    location /dashboard/assets/ {
        alias /var/www/helix-dashboard/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # The SPA shell must NEVER be cached: a rebuild (or a credential rotation)
    # otherwise leaves the browser running a stale bundle. add_header does not
    # inherit across levels, so the security headers are repeated deliberately.
    location /dashboard {
        alias /var/www/helix-dashboard;
        try_files $uri $uri/ /dashboard/index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }

    # API proxy → Fastify at 127.0.0.1:3101
    location /api/ {
        proxy_pass http://127.0.0.1:3101/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SparkGatekeeper hold queue (approvals surface) → 127.0.0.1:9100
    # Approve is WebAuthn-gated by the gatekeeper itself (fail-closed);
    # this proxy forwards only and does not bypass the passkey ceremony.
    # Enrollment (/setup) is UNAUTHENTICATED and upserts the single approver
    # credential — publishing it would let anyone enroll a passkey and then
    # approve held ops. Deliberately 404'd (same rule as the omokoda vhost).
    location ^~ /gk/setup { return 404; }
    # /invoke is the sidecar entry point, not a browser endpoint — not public.
    location = /gk/invoke { return 404; }
    location /gk/ {
        proxy_pass http://127.0.0.1:9100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    listen 127.0.0.1:8443 ssl;
    ssl_certificate /etc/letsencrypt/live/helixmain.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helixmain.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = helixmain.duckdns.org) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name helixmain.duckdns.org www.helixmain.duckdns.org;
    return 404;
}

[package]
name = "spark-gatekeeper"
version = "0.1.0"
edition = "2021"
description = "HelixMain SparkGatekeeper — 7 hermetic gates for per-card agent operations"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
webauthn-rs = "0.4"
url = "2"

[dev-dependencies]
# Tests use the real Santino's v4 fixtures embedded as strings.
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "server"
path = "src/bin/server.rs"

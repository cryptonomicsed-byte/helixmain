<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SparkGatekeeper — Approval Queue</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f0f0f;
        color: #e2e2e2;
        padding: 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; color: #fff; }
      h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
           letter-spacing: 0.05em; color: #888; margin-bottom: 1rem; }
      .hold-card {
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 1rem;
        background: #161616;
      }
      .hold-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.75rem;
      }
      .hold-title { font-weight: 600; font-size: 0.95rem; }
      .hold-meta { font-size: 0.75rem; color: #666; margin-top: 0.15rem; }
      .trail { margin: 0.75rem 0; }
      .trail-row {
        display: flex;
        gap: 0.75rem;
        font-size: 0.8rem;
        padding: 0.2rem 0;
        border-bottom: 1px solid #1e1e1e;
      }
      .trail-row:last-child { border-bottom: none; }
      .principle { width: 120px; color: #888; flex-shrink: 0; }
      .verdict-allow { color: #4ade80; }
      .verdict-deny { color: #f87171; }
      .verdict-escalate { color: #fbbf24; }
      .actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
      button {
        padding: 0.4rem 0.9rem;
        border: none;
        border-radius: 5px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-approve { background: #16a34a; color: #fff; }
      .btn-deny { background: #2a2a2a; color: #ccc; }
      .receipt-box {
        margin-top: 0.75rem;
        background: #0a1a0a;
        border: 1px solid #1a3a1a;
        border-radius: 5px;
        padding: 0.75rem;
        font-size: 0.75rem;
        font-family: monospace;
        color: #4ade80;
        word-break: break-all;
      }
      .error-box {
        margin-top: 0.75rem;
        background: #1a0a0a;
        border: 1px solid #3a1a1a;
        border-radius: 5px;
        padding: 0.75rem;
        font-size: 0.75rem;
        color: #f87171;
      }
      .payload-box {
        margin: 0.75rem 0 0;
        background: #111;
        border: 1px solid #252525;
        border-radius: 5px;
        padding: 0.6rem 0.75rem;
        font-size: 0.78rem;
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.15rem 0.75rem;
      }
      .payload-key { color: #666; }
      .payload-val { color: #e2e2e2; word-break: break-all; }
      .payload-val.amount { color: #fbbf24; font-weight: 600; }
      .empty { color: #555; font-size: 0.9rem; padding: 2rem 0; }
      .setup-section {
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin-bottom: 2rem;
        background: #111;
      }
      .setup-section input {
        background: #1e1e1e;
        border: 1px solid #333;
        border-radius: 4px;
        color: #e2e2e2;
        padding: 0.35rem 0.6rem;
        font-size: 0.8rem;
        margin-right: 0.5rem;
        width: 180px;
      }
      .status-bar {
        font-size: 0.72rem;
        color: #555;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>SparkGatekeeper — Approval Queue</h1>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

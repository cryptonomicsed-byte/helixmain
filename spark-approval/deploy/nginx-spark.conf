# SparkGatekeeper approval UI — drop into /etc/nginx/conf.d/ on the VPS.
#
# Serves the built Vite app at /spark/ and proxies the API to the
# spark-gatekeeper server running on 127.0.0.1:9100.
#
# WebAuthn requires HTTPS. RP_ID = omokoda.duckdns.org
# RP_ORIGIN = https://omokoda.duckdns.org  (set in systemd env below)
#
# To deploy:
#   1. scp spark-approval/dist/ root@2.25.70.156:/var/www/spark/
#   2. cp deploy/nginx-spark.conf /etc/nginx/conf.d/spark.conf
#   3. nginx -t && systemctl reload nginx
#   4. Start spark-gatekeeper (see deploy/spark-gatekeeper.service)

server {
    listen 443 ssl;
    server_name omokoda.duckdns.org;

    # TLS certs — adjust if using a separate cert path
    ssl_certificate     /etc/letsencrypt/live/omokoda.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omokoda.duckdns.org/privkey.pem;

    # Serve the compiled Vite app
    location /spark/ {
        alias /var/www/spark/;
        try_files $uri $uri/ /spark/index.html;
    }

    # Proxy API calls to spark-gatekeeper (loopback only)
    location /held {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location /setup {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }
}

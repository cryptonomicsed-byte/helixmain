# SparkGatekeeper approval UI — location snippet.
#
# IMPORTANT: This is NOT a standalone server block. On omokoda.duckdns.org
# the 443 listener is owned by nginx's stream SNI router
# (stream → 127.0.0.1:8443). Adding a second `listen 443 ssl; server_name
# omokoda.duckdns.org;` block will conflict with it.
#
# Instead, merge these locations into the existing omokoda vhost in
# /etc/nginx/sites-enabled/omokoda (inside the server block that listens
# on 127.0.0.1:8443 ssl), then: nginx -t && systemctl reload nginx
#
# To deploy the static assets:
#   scp -r spark-approval/dist/ root@2.25.70.156:/var/www/spark/
#   chmod -R a+rX /var/www/spark/

    # Serve the compiled Vite app
    location /spark/ {
        alias /var/www/spark/;
        try_files $uri $uri/ /spark/index.html;
    }

    # Proxy API calls to spark-gatekeeper (loopback-only service on :9100)
    location /held {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

    location /setup {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
    }

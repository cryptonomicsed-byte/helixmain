# EXAMPLE ONLY — not generated by card.compile_openshell_policy
# Hand-authored to validate the template schema during the spike.
# Schema source: github.com/NVIDIA/OpenShell crates/openshell-core/src/policy.rs
# Real compiler output goes to: compiled/<card_id>_v<n>/openshell-policy.yaml
# tool: card.compile_openshell_policy — NOT YET IMPLEMENTED

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app/zeroclaw
    - /etc
    - /var/log
  read_write:
    - /data/sandbox/dna_c1640d90
    - /data/minipae/dna_c1640d90
    - /tmp/sandbox-dna_c1640d90
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: agent
  run_as_group: agent

# NOTE on credentials: the inference API key is a Provider registered at the gateway,
# not declared here. OpenShell injects it only to requests bound for the approved host.
# Register it separately: openshell provider add --name openrouter ...
#
# NOTE on loopback endpoints: hold_queue and pocketbase are 127.0.0.1 here because
# they run as sidecars in the same Docker network. Validate during spike that
# OpenShell's proxy correctly intercepts loopback — may require container hostnames.

network_policies:
  hold_queue:
    name: hold-queue-sidecar
    endpoints:
      - host: 127.0.0.1
        port: 9100
    binaries:
      - path: /app/zeroclaw/zeroclaw

  inference:
    name: inference-endpoint
    endpoints:
      - host: openrouter.ai
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /app/zeroclaw/zeroclaw

  pocketbase:
    name: pocketbase-ops-store
    endpoints:
      - host: 127.0.0.1
        port: 8090
    binaries:
      - path: /app/zeroclaw/zeroclaw
